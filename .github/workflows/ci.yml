name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let every run on main finish; only a newer push to a PR replaces its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate Python entrypoint
        run: python3 -m py_compile docker-entrypoint.py

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          # Unpinned apt packages are in the discarded builder stage only.
          ignore: DL3008

      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.237.3 -- renovate-config-validator --strict renovate.json

  integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # A skipped job counts as passing a required check, so fork PRs fail here
      # instead of merging untested. Their commits can be tested from a branch in
      # this repository, where the registry secrets are available.
      - name: Stop fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::The integration test needs repository secrets. A maintainer must test this PR from a branch in this repository."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Run integration test
        run: ./scripts/integration-test.sh
        env:
          AERODROME_TEST_PROJECT: aerodrome-ci

      # Scans the image the test just ran, and reports even when the test failed.
      - name: Scan tested image for vulnerabilities
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aerodrome-ci-aerodrome:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
