services:
  aerodrome:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "${AERODROME_BIND_ADDRESS:-0.0.0.0}:${AERODROME_HOST_PORT:-8000}:8000"

    environment:
      TZ: America/Chicago

    volumes:
      - aerodrome-data:/data

volumes:
  aerodrome-data:
